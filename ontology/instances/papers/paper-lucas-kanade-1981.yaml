contribution: 提出基于图像亮度差最小二乘的迭代配准方法，开创稀疏光流算法；后经 Bouguet 扩展为金字塔 LK（KLT 跟踪器），成为视频稳像、SLAM、动作捕捉、光流跟踪的工业标准。
