keyInsight: 在局部窗口内，光流约束方程成为超定方程组，可用最小二乘得到最优位移估计。
novelty:
  - 提出基于亮度差最小化的迭代图像配准方法
  - 用局部窗口解决孔径问题
  - 给出牛顿法迭代求解框架
limitations:
  - 仅能处理小位移（需金字塔扩展）
  - 亮度恒常假设在实际中常被违反
