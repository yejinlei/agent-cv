contribution: "用每像素保留的最近样本做非参数密度估计（KNN 背景建模），无需假设高斯分布即可适应多模态背景。"
keyInsight: "背景像素的颜色分布未知，与其硬套高斯，不如直接记住它最近出现过的样本。"
novelty:
  - 非参数 KNN 密度估计
  - 样本缓存与自适应更新
  - 与 MOG 的高斯假设对比
limitations:
  - 内存随样本数增长
  - 对突然的光照变化需配合阴影抑制
