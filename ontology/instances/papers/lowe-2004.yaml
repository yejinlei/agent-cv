influencedBy:
  - "Lindeberg 的尺度空间理论（1994, 1998）"
  - "Koenderink 关于高斯核唯一性的证明（1984）"
  - "Moravec 角点检测（1977）→ Harris 角点（1988）"

influenced:
  - "SURF（2006）——DoG 换 Hessian，加速"
  - "ORB（2011）——用 BRIEF 描述子，实时"
  - "AKAZE / BRISK / KAZE 等一整代特征方法"
  - "学习式特征（SuperPoint、R2D2）的评测基准"
  - "SLAM / SFM 系统的标配（ORB-SLAM、COLMAP）"

