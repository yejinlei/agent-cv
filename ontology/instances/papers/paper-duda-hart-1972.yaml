id: paper-duda-hart-1972
type: Paper
title: Use of the Hough Transformation to Detect Lines and Curves in Pictures
authors:
  - Richard O. Duda
  - Peter E. Hart
year: 1972
venue: Communications of the ACM, Vol.15 No.1
venueType: journal
doi: "10.1145/361237.361242"
relatedAlgorithms:
