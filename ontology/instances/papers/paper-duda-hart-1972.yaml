keyInsight: 把霍夫原始 y=kx+b 参数化改为极坐标 ρ=xcosθ+ysinθ，解决垂直直线和参数无界问题，成为标准 HT。
novelty:
  - 极坐标参数化，参数有界
  - 系统分析累加器量化步长
  - 扩展到圆/曲线检测
limitations:
  - 仍需遍历所有边缘点
  - 复杂度高
readStatus: read
citationCount: 14000
contribution: 现代霍夫变换的标准版本，OpenCV HoughLines 即此实现。
