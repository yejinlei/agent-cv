id: paper-horn-schunck-1981
type: Paper
title: "Determining Optical Flow"
authors:
  - Berthold K. P. Horn
  - Brian G. Schunck
year: 1981
venue: Artificial Intelligence
venueType: journal
doi: 10.1016/0004-3702(81)90024-2
citationCount: 14000
relatedAlgorithms:
  - algo-horn-schunck
keyInsight: 光流可以写成一个全局能量泛函——亮度恒常的数据项加上运动场平滑的正则项，最小化这个能量就得到稠密光流。
novelty:
  - 提出光流约束方程 Ix·u + Iy·v + It = 0
  - 引入全局平滑正则项，用变分法求每个像素的运动，得到稠密解
limitations:
  - 全局平滑假设会在物体边界处「抹平」运动不连续
  - 对光照变化和大位移敏感
readStatus: read
contribution: 与 Lucas-Kanade 同年提出，是光流计算的两大奠基方法之一；首次把光流写成全局能量最小化问题，直接启发了后来的变分光流（Farneback）与深度学习光流（FlowNet、RAFT）。
tags: ["光流", "变分法", "1981", "经典论文"]
