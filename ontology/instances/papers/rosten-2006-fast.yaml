id: paper-rosten-2006-fast
type: Paper
title: Machine learning for high-speed corner detection
authors:
- Edward Rosten
- Tom Drummond
year: 2006
venue: European Conference on Computer Vision (ECCV)
venueType: conference
contribution: 用机器学习（ID3 决策树）把角点判定压到平均 3 次像素比较，速度比 Harris 快一个数量级。
keyInsight: 角点判定不需要完整的结构张量，只要邻域 16 个像素里有连续 9 个比中心亮或暗就足够。
novelty:
- ID3 训练决策树，角点判定平均 3 次比较
- 非极大值抑制提升定位精度
- SUSAN/Harris 思想的极致优化
limitations:
- 对边缘敏感，容易误检
- 不具备尺度不变性，需与图像金字塔结合（FAST-ER/AGAST 改进）
relatedAlgorithms:
- algo-fast
influencedBy:
- SUSAN 角点（Smith & Brady, 1997）
influenced:
- ORB 的特征检测子
- AGAST、FAST-ER 等高速角点变种
readStatus: skimmed
tags:
- classic
doi: 10.1007/11744023_34
url: https://link.springer.com/chapter/10.1007/11744023_34
citationCount: 8500
