id: op-svm-training
type: Operator
name: "SVM 训练"
nameEn: "Support Vector Machine Training"
category: statistical

plainTalk: >
  「画一条最宽的分界线」：给你一堆「是行人」和「不是行人」的特征向量，
  要画一条线把它们分开。但能分开的线有无数条，选哪条？
  选那条「离两边最近的点都尽量远」的——
  就像在两队人中间画线，要画在最宽敞的地方，不要贴着谁。
  特别的是，决定这条线的只有「最靠近它的那几个点」（支持向量），
  其他点离多远都无所谓。

formula: "max 2/||w|| s.t. y_i(wᵀx_i + b) ≥ 1"

params:
  - name: "C"
    meaning: "正则化参数（惩罚错分的强度）"
    typical: "1–100"
    effect: "C 大 = 更严格地分对训练集（易过拟合）；C 小 = 容忍一些错分"
  - name: "kernel"
    meaning: "核函数"
    typical: "linear（HOG 用线性）/ rbf"
    effect: "非线性核能处理更复杂的分界，但更慢"
  - name: "gamma"
    meaning: "RBF 核的宽度"
    typical: "'scale'（自动）"
    effect: "越大越容易过拟合"

opencvFunc: "cv2.ml.SVM_create / sklearn.svm.SVC"
usedBy:
  - algo-hog-svm

complexity: "训练 O(n²–n³)，预测 O(#支持向量)"
separability: false
inplace: false
noiseRobustness: medium
edgePreserve: false

useCases:
  - "HOG 特征的分类（行人检测的经典组合）"
  - "任何「高维特征 + 小样本」的分类任务"
  - "难例挖掘（Hard Negative Mining）"

pitfalls:
  - "特征必须归一化/标准化，否则量纲大的特征主导结果"
  - "HOG+SVM 用线性核就够了（高维特征下线性通常足够）"
  - "正负样本比例失衡时需要用不同的 C 或加权"

docsPath: "/algorithms/hog-svm/concepts"
tags: ["分类器", "SVM", "HOG配套"]
