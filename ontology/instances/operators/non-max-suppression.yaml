id: op-non-max-suppression
type: Operator
name: "非极大值抑制（边缘细化）"
nameEn: "Non-Maximum Suppression (edge thinning)"
category: edge

plainTalk: >
  「把粗线削成细线」：Sobel 找出来的边缘往往有好几像素宽（像粗马克笔画的线），
  而真正的边缘应该只有一条线（像铅笔）。NMS 的做法是：
  沿着边缘的垂直方向看，只保留最亮的那个点，其他「旁边稍微暗一点」的点全部抹掉。
  结果就是粗管变成细线，而且位置最准。

formula: "保留 (x,y) 当且仅当 M(x,y) ≥ M(x±1,y±1) 沿梯度方向上"

params:
  - name: "梯度方向"
    meaning: "先算梯度方向，再沿该方向比较"
    typical: "量化为 4 个方向（0°/45°/90°/135°）"
    effect: "方向量化越细越准，但更慢"
  - name: "邻域"
    meaning: "比较范围"
    typical: "两侧各 1 个像素"
    effect: "范围越大线越细，但可能断开"

opencvFunc: "（Canny 内部实现，无独立函数）"
usedBy:
  - algo-canny

complexity: "O(n)"
separability: false
inplace: false
noiseRobustness: medium
edgePreserve: true

useCases:
  - "边缘细化为单像素宽"
  - "目标检测中的候选框去重（同名但含义不同，见下）"

pitfalls:
  - "注意区分：目标检测里的 NMS 是「框去重」，边缘检测里的 NMS 是「线细化」，同名不同物"
  - "方向量化太粗 → 边缘出现锯齿"

docsPath: "/algorithms/canny/concepts"
tags: ["边缘", "细化", "关键步骤"]
