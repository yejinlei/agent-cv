id: op-hysteresis-tracking
type: Operator
name: "滞后连接（边缘追踪）"
nameEn: "Hysteresis Tracking"
category: edge

plainTalk: >
  「顺藤摸瓜」：双阈值筛完，还剩一些「不太确定的弱边缘」。
  现在从每个「确定边缘」出发，沿着它往外走，
  只要碰到「弱边缘」，就把它也确认为边缘，并继续从它往外走。
  这样一条断断续续的线，会从某个确定点开始一路被连起来。
  好处是：孤立的弱边缘（多半是噪声）不会凭空被留下，
  而属于同一条真实边缘的弱部分都被接上了。

formula: "弱边缘 e 被保留 ⟺ e 与某个强边缘 8-连通可达"

params:
  - name: "连通性"
    meaning: "邻域连接方式"
    typical: "8-连通"
    effect: "8 连通比 4 连通更容易把线连起来"

opencvFunc: "（Canny 内部实现）"
usedBy:
  - algo-canny

complexity: "O(n)"
separability: false
inplace: false
noiseRobustness: high
edgePreserve: true

useCases:
  - "Canny 的最后一步（把弱边缘接上强边缘）"
  - "任何「区域生长」类算法"
  - "连通域分析"

pitfalls:
  - "若低阈值过低，弱边缘太多，会把不相关的线也连起来"
  - "实现时要用队列/递归遍历，注意栈深度（大图递归会爆栈）"

docsPath: "/algorithms/canny/concepts"
tags: ["边缘连接", "区域生长", "Canny核心"]
