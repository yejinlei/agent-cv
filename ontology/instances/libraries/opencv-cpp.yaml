id: lib-opencv-cpp
type: Library
name: "OpenCV (C++)"
language: C++
role: "嵌入式与高性能场景的 OpenCV 原始形态。"
maturity: production
baselineVersion: "4.9"

plainTalk: >
  同一套 OpenCV，但用 C++ 调。在嵌入式板子（如树莓派、Jetson）
  或对性能有硬要求的工业系统上用这个，比 Python 版快。

strengths:
  - "无 Python 解释开销，性能最优"
  - "可直接对接硬件（相机 SDK、工业相机）"
  - "内存可控，适合长时间运行的嵌入式"
  - "可交叉编译到 ARM 平台"

weaknesses:
  - "开发效率低于 Python"
  - "需要手动管理 Mat 内存与生命周期"
  - "编译配置（CMake）有学习成本"

install: "apt install libopencv-dev   # 或源码 CMake 编译"
docsUrl: "https://docs.opencv.org/4.x/"
repoUrl: "https://github.com/opencv/opencv"

usedByAlgorithms:
  - algo-canny
  - algo-hog-svm
  - algo-sobel

docsPath: "/cases/edge-deployment"
tags: ["OpenCV", "C++", "嵌入式"]
