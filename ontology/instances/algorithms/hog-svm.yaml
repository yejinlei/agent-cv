id: algo-hog-svm
type: Algorithm
name: "HOG + SVM 行人检测"
nameEn: "Histogram of Oriented Gradients + Support Vector Machine"
year: 2005
branch: branch-detection

plainTalk: >
  「照影子认人」：它不看颜色，只看「影子的形状」。
  把图像切成一个个小格子，每个格子里统计「明暗变化的方向」，
  就像用铅笔素描时只画线条方向、不涂颜色。
  然后把相邻格子拼成块，块内做一次「亮度归一化」——这样光线变亮变暗都不怕。
  最后把这一串方向统计交给一个「会画分界线」的分类器（SVM），
  它就能判断「这个框里是不是一个人」。
  检测时用滑动窗口在图上不停地「扫描」，就像用放大镜一寸寸找东西。

concepts:
