plainTalk: "把像素想象成一个个小岛，岛与岛之间用桥连着，桥的宽窄代表两边颜色差多少。算法总是先在最相似的岛之间搭桥合并，一旦遇到颜色差异太大的『深沟』就停下来断开，于是画面自动被切成语义相近的一块块。"
