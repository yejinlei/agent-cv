id: algo-homography
type: Algorithm
name: 单应矩阵估计
nameEn: Homography Estimation
year: 1981
branch: branch-geometry
plainTalk: '你站在一栋楼前拍照，楼是方的，但照片里它是梯形（近大远小）。 单应矩阵就是一张"矫正表"：它告诉你照片上每个点应该挪到哪儿， 就能把那个梯形拉回成正方形。它只需要
  4 组"原来在哪、应该在哪"的点。

  '
concepts:
- concept-homography
- concept-ransac
evolvedFrom: null
