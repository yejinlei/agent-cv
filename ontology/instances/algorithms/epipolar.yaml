id: algo-epipolar
type: Algorithm
name: "对极几何与基础矩阵"
nameEn: "Epipolar Geometry & Fundamental Matrix"
year: 1981
branch: branch-geometry

plainTalk: >
  你有两只眼睛，同一个东西在左右两眼的成像位置不一样。
  对极几何给出了一条"搜索线"：在左眼看到某个点后，
  这个点在右眼里一定落在某条确定的直线上，不用满图乱找。
  这条线把"二维搜索"降成了"一维搜索"，是三维重建的关键。

