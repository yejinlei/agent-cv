plainTalk: "把一块豆腐先切成两半比大小，再各切两半继续比，最后把每层的『差异』和最后的『平均』都记下来。Haar 小波就是这种一层层切分图像的记录方式：大部分差异都很小，可以丢掉，于是图像被高效压缩，边缘信息还留在差异里。"
