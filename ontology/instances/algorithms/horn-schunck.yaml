id: algo-horn-schunck
type: Algorithm
name: Horn-Schunck 稠密光流
nameEn: Horn-Schunck Optical Flow
year: 1981
branch: branch-geometry
plainTalk: '与 Lucas-Kanade 同一年诞生的另一种光流算法，但它不挑点，而是给画面里每一个像素都算一个运动方向。 它的想法很朴素：相邻像素的运动应该「平滑地」变化，不会出现一个像素往左、紧挨着的就往右这种跳变。
  于是它把所有像素的运动连起来解一个全局最优化问题，一次得到一整张「运动地图」（稠密光流）。 代价是局部平滑假设会把物体边界处的运动「抹平」，所以今天工程上做稠密光流多用它的后继者
  Farneback。

  '
