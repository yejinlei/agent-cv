id: algo-canny
type: Algorithm
name: "Canny 边缘检测"
nameEn: "Canny Edge Detector"
year: 1986
branch: branch-feature-detection

plainTalk: >
  「自动描边小画家」：把照片里所有东西的轮廓，用细黑笔描出来。
  它会先用橡皮擦掉照片上的噪点（高斯模糊），再看哪里的明暗变化最剧烈（梯度），
  然后只保留变化最剧烈的那一条线（非极大值抑制），
  最后用「宽松门槛 + 严格门槛」两道关卡筛选，得到又细又连的轮廓。
  就像描眉毛——只描眉毛本身，不会把旁边的雀斑也描成眉毛。

