id: algo-sift
type: Algorithm
name: "SIFT 尺度不变特征变换"
nameEn: "Scale-Invariant Feature Transform"
year: 1999
branch: branch-feature-matching

plainTalk: >
  「认脸小能手」：不管你把这张照片拍得多远、多大、转了多少度、光线亮还是暗，
  它都能在照片里找到同一批「关键点」，并且能把这些点对上号。
  它干的第一件事是「把照片复印成从小到大的很多张」——这就是尺度空间，
  然后在每一张里找最特别的点（周围明暗变化最剧烈的点），
  这样不管物体大小，总有一张复印纸上的那个点是最突出的。
  再给每个点记下「周围明暗花纹的指纹」，这样换张照片也能认出来。

concepts:
  - concept-scale-space
  - concept-dog
  - concept-keypoint-localization
  - concept-orientation-assignment
  - concept-gradient-histogram-descriptor

