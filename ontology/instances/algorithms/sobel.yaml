id: algo-sobel
type: Algorithm
name: "Sobel 边缘算子"
nameEn: "Sobel Operator"
year: 1968
branch: branch-image-processing

plainTalk: >
  「摸变化的尺子」：拿一个 3×3 的小方块横一下、竖一下在图像上滑，
  哪边像素明暗变化最剧烈，哪里就是边。
  它比「硬相减」多了一点点模糊（中心权重更大），所以对噪点更宽容。
  它是后来 Canny、HOG、Harris、光流等一大票算法的公共前置零件——
  凡是需要「梯度」的地方，第一步几乎都在算它。

