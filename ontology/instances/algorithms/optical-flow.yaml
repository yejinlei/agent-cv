id: algo-optical-flow
type: Algorithm
name: "Lucas-Kanade 光流"
nameEn: "Lucas-Kanade Optical Flow"
year: 1981
branch: branch-geometry

plainTalk: >
  看一段视频，同一个亮点在上一帧和这一帧的位置差了一点点。
  光流就是算这个"差了多少、往哪个方向差"。
  它假设一小块区域内的所有点都朝同一个方向移动，
  于是可以解出这块区域的整体运动——这就是"像素在往哪跑"。

concepts:
  - concept-optical-flow

