id: case-heritage
type: CaseStudy
name: "文物数字化与档案扫描"
sector: culture

plainTalk: >
  博物馆要把一批发黄、褶皱、光照不均的老文献数字化。
  难点是：纸是弯的、墨迹会晕、不同页的底色深浅不一。
  靠传统图像处理方法，可以做到既保留笔墨细节，又统一背景色。

scenario: >
  某档案馆需数字化 3 万页民国时期报刊（纸张泛黄、边缘破损、
  存在折痕阴影）。要求输出无损 TIFF 与可检索的增强版 JPG，
  文字区域对比度明显提升，同时保留纸张纹理的质感（不得过度二值化）。

pipeline:
  - step: "去背景光照"
    detail: "估计光照背景（大核高斯或形态学开运算），原图除以背景做归一化，消除折痕阴影"
  - step: "去噪保边"
    detail: "非局部均值或双边滤波，去掉扫描噪点但保住笔画边缘"
  - step: "局部对比度增强"
    detail: "CLAHE（限制对比度自适应直方图均衡）分块增强，避免全局均衡导致局部过曝"
  - step: "倾斜矫正"
    detail: "霍夫直线检测找文本行方向，计算倾角后仿射旋转校正"
  - step: "色彩归一"
    detail: "按页面估计白点做白平衡，把泛黄底色拉到中性，但限制幅度以保留年代感"

hardware:
  device: "PC（i7 + 16 GB）"
  os: "Windows / Linux"
  camera: "图书专用扫描仪（非接触式，600 dpi）"
  lighting: "两侧柔光，避免中央高光"

settings:
  - name: "背景估计核"
    value: "高斯核 101×101（或形态学闭运算 51×51）"
  - name: "CLAHE clipLimit"
    value: "2.0，tileGridSize=8×8"
  - name: "白平衡幅度"
    value: "限制在 ±15% 灰度以内"

results:
  - metric: "OCR 识别率提升"
    value: "由 76% → 94%"
    note: "增强后送入 OCR"
  - metric: "折痕阴影消除"
    value: "主观评价基本不可见"
    note: "版面亮度均匀度提升明显"
  - metric: "处理速度"
    value: "约 1.2 s/页（600 dpi A3）"

lessons:
  - lesson: "先归一再增强，顺序不能反"
    detail: "若先做直方图均衡再修光照，会放大阴影不均；必须先除法归一化消除光照项。"
  - lesson: "CLAHE 比全局均衡更适合文献"
    detail: "全局均衡会把本就偏白的区域过曝，CLAHE 分块且限幅，局部提升更安全。"
  - lesson: "倾斜矫正用霍夫比用轮廓稳"
    detail: "破损边缘会让最小外接矩形方法失效，霍夫直线统计文本行角度更鲁棒。"
  - lesson: "保留质感比追求纯白更重要"
    detail: "档案馆要求保留纸张质感，过度二值化会被拒收；参数需要领域专家参与验收。"

whyClassic: >
  ① 光学模型明确（光照是乘性、阴影是低频），传统方法可用简单数学模型精确去除；
  ② 可逐页可视化中间结果，便于专家验收；
  ③ 不依赖训练数据（文物样本无法大规模采集）；
  ④ 处理过程可复现，符合档案保存的规范要求。

substituteByDL: >
  深度学习可用于版面分析与文本检测（如 OCR 前端），
  但光照归一化这类"确定性修复"用传统方法更精确、更可控、更易解释。

relatedAlgorithms:
  - op-histogram
  - op-gaussian-blur

docsPath: "/cases/"
tags: ["文物", "档案", "增强", "OCR"]
