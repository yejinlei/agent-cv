id: concept-image-pyramid
type: Concept
name: "图像金字塔"
brief: "通过不断降采样或改变卷积核大小得到多尺度图像/特征层的结构，是多尺度检测必备基础。"
layer: L2
plainTalk: >
  图像金字塔就像把照片拿远看：你站 1 米外看整张脸、3 米外看到整个人、10 米外看到整个房间，
  因为人的脸在照片里可能是大头像（近）也可能是远景（小），同一个人脸模板（24×24 的滑窗）
  要在不同距离下都能命中，就必须把原图一层层缩小，每层用同一大小的窗口去扫。
  缩得越密（scaleFactor=1.05 越接近 1）检测越准但越慢。
detail: >
  两种生成方式：① 降采样金字塔（Viola-Jones/HOG/ORB）：每层按固定 scaleFactor 缩小；
  ② 尺度空间金字塔（SIFT/SURF）：保持图像尺寸不变，放大高斯/Hessian 核。金字塔层数
  决定能检测的最小/最大目标比，常见 8–16 层。
related:
