$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-cv.dev/ontology/schema/application.schema.yaml"
title: Application
description: >
  Application（应用场景）：算法最终落地的场景。
  这是「四层闭环」的终点（L4），也是本站「不空谈算法」的保证——
  每个算法都必须能说出「它在哪儿被真正用到」。
type: object

required:
  - id
  - type
  - name
  - domain
  - plainTalk
  - algorithmStack

additionalProperties: false

properties:
  id:
    type: string
    pattern: "^app-[a-z0-9-]+$"

  type:
    const: Application

  name:
    type: string

  domain:
    type: string
    enum:
      - industrial
      - medical
      - automotive
      - consumer
      - security
      - remote-sensing
      - robotics
      - entertainment
      - research
    description: 所属领域

  plainTalk:
    type: string
    minLength: 10
    description: 用一句生活化的话说清这个场景在干什么

  algorithmStack:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^(algo|op)-[a-z0-9-]+$"
    description: 该场景用到的算法/算子链路（顺序有意义）

  hardware:
    type: object
    additionalProperties: false
    properties:
      device:
        type: string
        description: 典型设备，如 工业相机 + 工控机
      needsGPU:
        type: boolean
        default: false
        description: 是否需要 GPU——本站强调「传统 CV 无需 GPU」
      fps:
        type: string
        description: 典型帧率要求
      resolution:
        type: string
        description: 典型分辨率

  constraints:
    type: array
    items:
      type: string
    description: 场景的硬约束（延时、精度、成本、光照…）

  metrics:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        target:
          type: string
        note:
          type: string

  whyClassic:
    type: string
    description: >
      为什么这个场景「传统 CV 至今不可替代」。
      这是本站与深度学习方案对比时的核心论据

  substituteByDL:
    type: [string, "null"]
    description: 深度学习是否能替代？如果部分可替代，说明在什么条件下

  caseStudies:
    type: array
    items:
      type: string
      description: 关联的详细案例 ID

  docsPath:
    type: string

  tags:
    type: array
    items:
      type: string
