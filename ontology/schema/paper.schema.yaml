$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://agent-cv.dev/ontology/schema/paper.schema.yaml"
title: Paper
description: >
  Paper（论文）：传统 CV 算法的原始文献。
  每条论文必须给出可核验的出处（DOI / 会议 / 期刊），不允许凭印象写。
  这是「四层闭环」的入口层（L1）。
type: object

required:
  - id
  - type
  - title
  - authors
  - year
  - contribution

additionalProperties: false

properties:
  id:
    type: string
    pattern: "^paper-[a-z0-9-]+$"
    description: 如 paper-canny-1986

  type:
    const: Paper

  title:
    type: string
    minLength: 5
    description: 论文原标题（保留英文原题）

  authors:
    type: array
    minItems: 1
    items:
      type: string
    description: 作者列表，按原论文署名顺序

  year:
    type: integer
    minimum: 1950
    maximum: 2030

  venue:
    type: string
    description: 发表会议或期刊，如 "IEEE TPAMI"

  venueType:
    type: string
    enum: [journal, conference, workshop, technical-report, thesis, patent, preprint]
    description: 发表类型

  doi:
    type: [string, "null"]
    description: DOI 编号。没有 DOI 时才填 null

  url:
    type: [string, "null"]
    description: 可公开访问的链接

  citationCount:
    type: integer
    minimum: 0
    description: 引用量的量级（可填最近一次查到的数值）

  contribution:
    type: string
    minLength: 20
    description: >
      核心贡献——必须说清「这篇论文做对了什么别人没做对的事」，
      不是简单复述摘要

  keyInsight:
    type: string
    description: 一句话洞察，最好是一句能记住的话

  novelty:
    type: array
    items:
      type: string
    description: 相比前人的新增点

  limitations:
    type: array
    items:
      type: string
    description: 论文自己承认或后人指出的局限

  relatedAlgorithms:
    type: array
    items:
      type: string
      pattern: "^algo-[a-z0-9-]+$"

  influencedBy:
    type: array
    items:
      type: string
    description: 受哪些论文/工作影响

  influenced:
    type: array
    items:
      type: string
    description: 影响了哪些后续工作（传承线索的关键）

  readStatus:
    type: string
    enum: [unread, abstract-only, skimmed, read, deep-read]
    description: 精读状态——本站承诺「读过的才写」

  bibtex:
    type: string
    description: BibTeX 条目，便于读者直接引用

  docsPath:
    type: string

  tags:
    type: array
    items:
      type: string
